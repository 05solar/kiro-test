spring:
  datasource:
    # 테스트는 외부 DB 없이 실행할 수 있어야 하므로 H2 인메모리를 PostgreSQL 호환 모드로 사용한다.
    url: jdbc:h2:mem:naeil_study_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  flyway:
    # 테스트는 H2 를 쓴다. 마이그레이션 스크립트는 PostgreSQL 문법이라 그대로 돌지 않는다
    # (DO $$ 블록, character varying 기반 pg_constraint 조회 등).
    # 스키마는 아래 ddl-auto=create-drop 이 엔티티에서 직접 만든다.
    #
    # 그래서 **마이그레이션 파일의 정확성은 이 테스트들이 잡아 주지 않는다.**
    # 실제 PostgreSQL 로 확인하는 것은 scripts/migration-verify.sh 가 한다.
    enabled: false

  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

session:
  expiration-days: 30
  code:
    max-generation-attempts: 10

logging:
  level:
    com.naeil.study: INFO
