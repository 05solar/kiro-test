spring:
  datasource:
    # 테스트는 외부 DB 없이 실행할 수 있어야 하므로 H2 인메모리를 PostgreSQL 호환 모드로 사용한다.
    url: jdbc:h2:mem:naeil_study_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

session:
  expiration-days: 30
  code:
    max-generation-attempts: 10

logging:
  level:
    com.naeil.study: INFO
