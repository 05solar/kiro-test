spring:
  application:
    name: study-backend

  config:
    # 로컬 개발용 .env 를 읽는다. 형식은 properties 와 같다(KEY=값).
    # optional 이라 파일이 없어도 뜬다. 배포 환경에서는 파일 대신 환경변수를 쓴다.
    # .env 는 .gitignore 에 있다. 키를 저장소에 올리지 않는다.
    import: optional:file:./.env[.properties]

  datasource:
    # DB 접속 정보는 환경변수로 주입한다. 로컬 기본값은 개발 편의를 위한 값이며 운영에서는 반드시 재정의한다.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/naeil_study}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  servlet:
    multipart:
      # DocumentPolicy 의 제한과 같은 값으로 맞춘다. 컨테이너가 먼저 잘라내는 경우도
      # GlobalExceptionHandler 에서 FILE_SIZE_EXCEEDED 로 응답한다.
      max-file-size: ${MAX_FILE_SIZE:20MB}
      max-request-size: ${MAX_REQUEST_SIZE:100MB}

  jpa:
    hibernate:
      # MVP 개발 단계에서는 update, 운영 전환 시 validate + 마이그레이션 도구로 교체한다.
      ddl-auto: ${JPA_DDL_AUTO:update}
    open-in-view: false
    show-sql: ${JPA_SHOW_SQL:true}
    properties:
      hibernate:
        format_sql: true

server:
  port: ${SERVER_PORT:8080}

storage:
  local:
    # 개발용 로컬 Storage 루트. 배포 시 S3 호환 구현으로 교체한다.
    root-path: ${STORAGE_ROOT_PATH:./uploads}

ai:
  # AI 공급자. gemini(기본) 또는 anthropic. 도메인 코드는 공급자를 모른다.
  # 기본을 gemini 로 둔 것은 이 프로젝트가 Gemini 키로 운영되기 때문이다.
  provider: ${AI_PROVIDER:gemini}
  # API 키는 코드에 두지 않는다. 비어 있으면 분석 요청 시점에만 실패하고, 나머지 기능은 동작한다.
  api-key: ${AI_API_KEY:}
  model: ${AI_MODEL:claude-opus-5}
  gemini:
    # provider=gemini 일 때 쓰는 키와 모델. 역시 환경변수로만 받는다.
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-3.5-flash-lite}
  # 외부 호출을 무한정 기다리지 않는다. 강의자료가 크면 한 번의 호출도 오래 걸린다.
  timeout-seconds: ${AI_TIMEOUT_SECONDS:180}
  # 연결 오류와 일시적인 서버 오류에 대한 재시도. 응답 형식 오류는 여기서 재시도하지 않는다.
  max-retries: ${AI_MAX_RETRIES:2}
  analysis:
    # 조각 크기는 글자 수 기준이다. 토큰 수로 두면 특정 모델의 토크나이저에 묶인다.
    chunk-size: ${AI_CHUNK_SIZE:8000}
    chunk-overlap: ${AI_CHUNK_OVERLAP:300}
    # 지나치게 잘게 쪼갠 Topic이 쏟아지지 않도록 상한을 둔다.
    max-topics: ${AI_MAX_TOPICS:30}

curriculum:
  # 학습 단계 하나에 배정하는 최소 시간. 이보다 짧으면 아예 넣지 않는다.
  min-topic-minutes: ${CURRICULUM_MIN_TOPIC_MINUTES:5}
  # 남는 시간이 이만큼 이상일 때만 마지막 복습 단계를 만든다.
  review-min-minutes: ${CURRICULUM_REVIEW_MIN_MINUTES:10}
  # 복습 단계에 배정할 수 있는 최대 시간. 남는 시간을 전부 복습에 몰아주지 않는다.
  review-max-minutes: ${CURRICULUM_REVIEW_MAX_MINUTES:45}

quiz:
  # Topic 하나당 생성할 문제 수. AI가 근거 부족으로 더 적게(최소 3개) 만들 수 있다.
  questions-per-topic: ${QUIZ_QUESTIONS_PER_TOPIC:5}
  # AI에 보낼 강의자료 추출 구간의 최대 길이(글자 수). 문서 전체를 다시 보내지 않는다.
  max-context-characters: ${QUIZ_MAX_CONTEXT_CHARACTERS:20000}

wrong-answer-summary:
  # 오답 요약에서 Topic 하나당 AI에 보낼 추출 구간의 최대 길이(글자 수).
  # 여러 Topic 이 한 요청에 담기므로 퀴즈 생성보다 작게 잡는다.
  max-context-characters-per-topic: ${WRONG_ANSWER_SUMMARY_MAX_CONTEXT_PER_TOPIC:8000}

session:
  # 마지막 접근 후 보관 일수. 조회에 성공할 때마다 expiresAt = now + expiration-days 로 연장된다.
  expiration-days: ${SESSION_EXPIRATION_DAYS:30}
  code:
    # 중복되지 않는 8자리 코드를 뽑기 위한 최대 재시도 횟수.
    max-generation-attempts: ${SESSION_CODE_MAX_ATTEMPTS:10}

logging:
  level:
    com.naeil.study: ${LOG_LEVEL:DEBUG}
