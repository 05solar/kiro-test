spring:
  application:
    name: study-backend

  config:
    # 로컬 개발용 .env 를 읽는다. 형식은 properties 와 같다(KEY=값).
    # optional 이라 파일이 없어도 뜬다. 배포 환경에서는 파일 대신 환경변수를 쓴다.
    # .env 는 .gitignore 에 있다. 키를 저장소에 올리지 않는다.
    import: optional:file:./.env[.properties]

  datasource:
    # DB 접속 정보는 환경변수로 주입한다. 로컬 기본값은 개발 편의를 위한 값이며 운영에서는 반드시 재정의한다.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/naeil_study}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  servlet:
    multipart:
      # DocumentPolicy 의 제한과 같은 값으로 맞춘다. 컨테이너가 먼저 잘라내는 경우도
      # GlobalExceptionHandler 에서 FILE_SIZE_EXCEEDED 로 응답한다.
      max-file-size: ${MAX_FILE_SIZE:20MB}
      max-request-size: ${MAX_REQUEST_SIZE:100MB}

  flyway:
    # 스키마는 애플리케이션이 뜨면서 스스로 적용한다.
    #
    # 예전에는 사람이 psql 로 먼저 적용해야 했다. 순서를 한 번만 틀리면 —— 새 이미지를
    # 먼저 올리면 —— 기동 중 Schema-validation 으로 죽었다. 실제로 겪었다.
    # Flyway 는 Hibernate 검증보다 **먼저** 돌기 때문에 그 순서가 뒤집힐 수 없다.
    enabled: ${FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    # 이미 테이블이 있는데 이력 표가 없는 DB(= Flyway 도입 전에 손으로 만든 DB)를
    # V1 이 적용된 것으로 표시하고 V2 부터 이어서 적용한다. 이것이 없으면
    # "found non-empty schema without schema history table" 로 기동이 멈춘다.
    baseline-on-migrate: true
    baseline-version: 1
    # 이미 적용된 마이그레이션의 내용이 바뀌었으면 기동을 멈춘다.
    # 조용히 넘어가면 서버마다 스키마가 달라지고, 그 사실을 아무도 모른다.
    validate-on-migrate: true

  jpa:
    hibernate:
      # 스키마를 만드는 것은 Flyway 다. Hibernate 는 확인만 한다.
      #
      # update 로 두면 엔티티에 필드를 더했을 때 로컬에서는 조용히 만들어지고,
      # 마이그레이션 파일을 안 쓴 채로 배포된다. 그 사실은 EC2 에서야 드러난다.
      # validate 면 그 자리에서, 내 컴퓨터에서 드러난다.
      ddl-auto: ${JPA_DDL_AUTO:validate}
    open-in-view: false
    show-sql: ${JPA_SHOW_SQL:true}
    properties:
      hibernate:
        format_sql: true

server:
  port: ${SERVER_PORT:8080}

storage:
  local:
    # 개발용 로컬 Storage 루트. 배포 시 S3 호환 구현으로 교체한다.
    root-path: ${STORAGE_ROOT_PATH:./uploads}

ai:
  # AI 호출 방식. 모든 AI 기능(분석·퀴즈)의 기본값이 된다.
  #   mock    AI 를 부르지 않고 목 데이터를 만든다. 과금되지 않는다.
  #   gemini  실제 AI 를 부른다. 아래 provider 설정을 따른다.
  #
  # 기본이 mock 인 이유는 화면을 한 번 확인할 때마다 과금되는 것을 막기 위해서다.
  # 분석은 자료 조각 수만큼 부르므로 특히 비싸다.
  # 배포에서는 LLM_MODE=gemini 를 넣는다(docker-compose 에 이미 들어 있다).
  mode: ${LLM_MODE:mock}
  # AI 공급자. gemini(기본) 또는 anthropic. 도메인 코드는 공급자를 모른다.
  # 기본을 gemini 로 둔 것은 이 프로젝트가 Gemini 키로 운영되기 때문이다.
  provider: ${AI_PROVIDER:gemini}
  # API 키는 코드에 두지 않는다. 비어 있으면 분석 요청 시점에만 실패하고, 나머지 기능은 동작한다.
  api-key: ${AI_API_KEY:}
  model: ${AI_MODEL:claude-opus-5}
  gemini:
    # provider=gemini 일 때 쓰는 키와 모델. 역시 환경변수로만 받는다.
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-3.5-flash-lite}
  # 외부 호출을 무한정 기다리지 않는다. 강의자료가 크면 한 번의 호출도 오래 걸린다.
  timeout-seconds: ${AI_TIMEOUT_SECONDS:180}
  # 연결 오류와 일시적인 서버 오류에 대한 재시도. 응답 형식 오류는 여기서 재시도하지 않는다.
  max-retries: ${AI_MAX_RETRIES:2}
  analysis:
    # 조각 크기는 글자 수 기준이다. 토큰 수로 두면 특정 모델의 토크나이저에 묶인다.
    chunk-size: ${AI_CHUNK_SIZE:8000}
    chunk-overlap: ${AI_CHUNK_OVERLAP:300}
    # 지나치게 잘게 쪼갠 Topic이 쏟아지지 않도록 상한을 둔다.
    max-topics: ${AI_MAX_TOPICS:30}

curriculum:
  # 학습 단계 하나에 배정하는 최소 시간. 이보다 짧으면 아예 넣지 않는다.
  min-topic-minutes: ${CURRICULUM_MIN_TOPIC_MINUTES:5}
  # 남는 시간이 이만큼 이상일 때만 마지막 복습 단계를 만든다.
  review-min-minutes: ${CURRICULUM_REVIEW_MIN_MINUTES:10}
  # 복습 단계에 배정할 수 있는 최대 시간. 남는 시간을 전부 복습에 몰아주지 않는다.
  review-max-minutes: ${CURRICULUM_REVIEW_MAX_MINUTES:45}

quiz:
  # 퀴즈를 만드는 방식.
  #   mock    AI 를 부르지 않고 목 데이터를 만든다. 과금되지 않는다.
  #   gemini  실제 AI 를 부른다. ai.provider 설정을 따른다.
  #
  # 기본이 mock 인 이유는 "새로운 퀴즈 만들기"처럼 여러 번 눌러 보게 되는 기능 때문이다.
  # 화면을 한 번 확인할 때마다 과금되는 것보다, 실수로 꺼져 있는 편이 낫다.
  # 배포에서는 QUIZ_AI_MODE=gemini 를 넣는다(docker-compose 에 이미 들어 있다).
  # 비워 두면 위의 ai.mode 를 따른다. 퀴즈만 따로 켜고 싶을 때 쓴다.
  ai-mode: ${QUIZ_AI_MODE:${ai.mode:mock}}
  # Topic 하나당 생성할 문제 수. AI가 근거 부족으로 더 적게(최소 3개) 만들 수 있다.
  questions-per-topic: ${QUIZ_QUESTIONS_PER_TOPIC:5}
  # AI에 보낼 강의자료 추출 구간의 최대 길이(글자 수). 문서 전체를 다시 보내지 않는다.
  max-context-characters: ${QUIZ_MAX_CONTEXT_CHARACTERS:20000}

chat:
  # 챗봇 응답 방식.
  #   mock    AI 를 부르지 않고 목 응답을 만든다. 과금되지 않는다.
  #   gemini  실제 AI 를 부른다. ai.provider 설정을 따른다.
  #
  # 기본이 mock 인 이유는 챗봇이 가장 자주 눌리는 기능이기 때문이다. 화면을 한 번
  # 확인하는 동안 질문을 서너 개 던지게 되고, 그때마다 과금된다.
  # 비워 두면 위의 ai.mode 를 따른다. 챗봇만 따로 켜고 싶을 때 쓴다.
  ai-mode: ${CHAT_AI_MODE:${ai.mode:mock}}
  # 프롬프트에 넣을 지난 대화 수. 전부 넣으면 요청이 길어지고 옛 화제가 답을 끌고 간다.
  history-size: ${CHAT_HISTORY_SIZE:8}
  # AI 에 보낼 강의자료 구간의 최대 길이(글자 수). 퀴즈보다 작게 잡는다 —
  # 질문 하나에 답하는 데 자료 전체가 필요하지 않고, 매 질문마다 비용이 든다.
  max-context-characters: ${CHAT_MAX_CONTEXT_CHARACTERS:6000}
  # 사용자가 화면 앞에서 기다리는 기능이다. 분석·퀴즈보다 짧게 끊는다.
  timeout-seconds: ${CHAT_TIMEOUT_SECONDS:45}

wrong-answer-summary:
  # 오답 요약에서 Topic 하나당 AI에 보낼 추출 구간의 최대 길이(글자 수).
  # 여러 Topic 이 한 요청에 담기므로 퀴즈 생성보다 작게 잡는다.
  max-context-characters-per-topic: ${WRONG_ANSWER_SUMMARY_MAX_CONTEXT_PER_TOPIC:8000}

session:
  # 마지막 접근 후 보관 일수. 조회에 성공할 때마다 expiresAt = now + expiration-days 로 연장된다.
  expiration-days: ${SESSION_EXPIRATION_DAYS:30}
  code:
    # 중복되지 않는 8자리 코드를 뽑기 위한 최대 재시도 횟수.
    max-generation-attempts: ${SESSION_CODE_MAX_ATTEMPTS:10}
  cleanup:
    # 보관 기한이 지난 세션과 그 파일을 지운다. 없으면 디스크와 DB가 무한정 늘어나고,
    # "30일 후 삭제"라는 사용자와의 약속도 지켜지지 않는다.
    enabled: ${SESSION_CLEANUP_ENABLED:true}
    # 애플리케이션 시간대 기준. 기본은 매일 새벽 4시.
    cron: ${SESSION_CLEANUP_CRON:0 0 4 * * *}
    # 한 번에 지우는 세션 수. 오래 방치된 환경의 첫 실행이 DB를 오래 잠그지 않게 한다.
    batch-size: ${SESSION_CLEANUP_BATCH_SIZE:200}

logging:
  level:
    com.naeil.study: ${LOG_LEVEL:DEBUG}

app:
  # 시각 계산의 기준 시간대. OS 설정에 기대지 않는다.
  # AWS의 EC2/ECS는 기본이 UTC라 이 값을 두지 않으면 남은 시간이 9시간 부풀려진다.
  timezone: ${APP_TIMEZONE:Asia/Seoul}
  cors:
    # 프론트를 다른 도메인에 올릴 때만 채운다. 비어 있으면 CORS 설정을 등록하지 않는다.
    # 예: https://naeil.example.com,https://www.naeil.example.com
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}

management:
  endpoints:
    web:
      exposure:
        # 헬스체크만 연다. env/beans/mappings 는 내부 구조를 노출한다.
        include: health
  endpoint:
    health:
      # 로드밸런서가 DB 장애를 감지할 수 있어야 한다. 200만 보고 살았다고 판단하면 안 된다.
      show-details: never
      probes:
        enabled: true
  health:
    db:
      enabled: true
