plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.16'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.naeil'
version = '0.0.1-SNAPSHOT'
description = 'Naeil Study MVP Backend'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-validation'

	// 헬스체크. 로드밸런서가 DB까지 살아 있는지 확인할 수 있어야 한다.
	implementation 'org.springframework.boot:spring-boot-starter-actuator'

	// 스키마 마이그레이션. 애플리케이션이 뜨면서 스스로 적용한다.
	// 사람이 psql 로 먼저 적용하던 방식은 순서를 한 번만 틀려도 기동 중 죽었다.
	// Flyway 10 부터 DB별 지원이 모듈로 분리됐다. postgresql 모듈이 없으면
	// "Unsupported Database: PostgreSQL" 로 기동에 실패한다.
	implementation 'org.flywaydb:flyway-core'
	implementation 'org.flywaydb:flyway-database-postgresql'

	// 문서 텍스트 추출. Spring Boot BOM이 관리하지 않으므로 버전을 명시한다.
	implementation 'org.apache.pdfbox:pdfbox:3.0.8'
	implementation 'org.apache.poi:poi-ooxml:5.5.1'

	// AI 분석. Spring Boot BOM이 관리하지 않으므로 버전을 명시한다.
	implementation 'com.anthropic:anthropic-java:2.34.0'

	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	runtimeOnly 'org.postgresql:postgresql'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'com.h2database:h2'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testCompileOnly 'org.projectlombok:lombok'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
}

tasks.withType(Test).configureEach {
	systemProperty 'file.encoding', 'UTF-8'
}

tasks.named('test') {
	useJUnitPlatform()
	testLogging {
		events 'passed', 'skipped', 'failed'
	}
}
