# ── 한글 경로 대응 (Windows 전용) ─────────────────────────────────────────────
# 이 프로젝트는 C:\바탕 화면\kiro-project 처럼 경로에 한글과 공백이 들어 있다.
# Gradle은 테스트 워커 JVM에 클래스패스를 @argfile 로 전달하는데,
#   - Gradle 데몬(JDK 18+)은 argfile 을 file.encoding(기본 UTF-8) 으로 쓰고
#   - java.exe 는 argfile 을 OS 네이티브 인코딩(여기서는 MS949) 으로 읽는다.
# 이 불일치 때문에 경로가 깨져 모든 테스트가 ClassNotFoundException 으로 실패한다.
# 아래 설정으로 Gradle 데몬의 file.encoding 을 네이티브 인코딩에 맞춰 argfile 을 읽을 수 있게 한다.
# (테스트 JVM 자체는 build.gradle 에서 file.encoding=UTF-8 로 다시 고정한다.)
# 프로젝트를 ASCII 경로로 옮기면 이 설정은 필요 없다.
org.gradle.jvmargs=-Dfile.encoding=MS949 -Xmx1g
