# ── 한글 경로 대응 (Windows 개발 환경 전용) ──────────────────────────────────
# 이 저장소를 C:\바탕 화면\kiro-project 처럼 한글과 공백이 든 경로에 두면,
# Gradle 이 테스트 워커 JVM 에 클래스패스를 @argfile 로 넘기는 과정에서 경로가 깨진다.
#   - Gradle 데몬(JDK 18+)은 argfile 을 file.encoding(기본 UTF-8) 으로 쓰고
#   - java.exe 는 argfile 을 OS 네이티브 인코딩(MS949) 으로 읽는다.
# 이 불일치 때문에 모든 테스트가 ClassNotFoundException 으로 실패한다.
# 아래 설정이 그것을 막는다. Windows 개발 환경에서는 지우지 말 것.
#
# 리눅스(도커 빌드·CI)에서는 이 값이 맞지 않는다. MS949 를 강제하면 빌드 로그의
# 한글이 깨진다. org.gradle.jvmargs 는 Gradle 데몬이 뜨는 시점에 읽히므로
# build.gradle 에서 조건 분기할 수 없다. 그래서 Dockerfile 에서 명령행으로 덮어쓴다.
#
#   ./gradlew -Dorg.gradle.jvmargs="-Dfile.encoding=UTF-8 -Xmx1g" bootJar
#
# 명령행 -D 가 이 파일보다 우선한다.
# 프로젝트를 ASCII 경로로 옮기면 이 설정 자체가 필요 없다.
#
# 컴파일 결과물과 테스트 JVM 의 인코딩은 build.gradle 에서 UTF-8 로 따로 고정한다.
org.gradle.jvmargs=-Dfile.encoding=MS949 -Xmx1g
