# 「내일까지 해야 하는데」 전체 스택.
#
#   docker compose up -d --build
#
# 이 한 줄로 DB · 백엔드 · 프론트가 뜬다. 브라우저에서 http://<서버주소> 를 연다.
#
# 필요한 것은 저장소 루트의 .env 하나뿐이다.
#
#   GEMINI_API_KEY=...
#
# 자세한 절차는 docs/deployment.html 참고.

name: naeil

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-naeil_study}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      TZ: ${APP_TIMEZONE:-Asia/Seoul}
    volumes:
      - db-data:/var/lib/postgresql/data
      # 빈 데이터 디렉터리로 처음 뜰 때만 실행된다. 백엔드는 운영 프로파일에서
      # ddl-auto=validate 라 스키마를 만들지 않으므로 여기서 넣어 준다.
      - ./docs/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      # 백엔드가 DB 를 기다렸다가 뜨게 한다. 없으면 첫 기동에서 연결 실패로 죽는다.
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-naeil_study}"]
      interval: 5s
      timeout: 5s
      retries: 20
    # DB 를 밖으로 열지 않는다. 백엔드만 내부 네트워크로 접근한다.
    expose:
      - "5432"

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME:-naeil_study}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      # AI 키. 저장소 루트 .env 에서 읽는다. 이미지에 넣지 않는다.
      GEMINI_API_KEY: ${GEMINI_API_KEY:?GEMINI_API_KEY 를 .env 에 넣어 주세요}
      AI_PROVIDER: ${AI_PROVIDER:-gemini}
      # 배포에서는 실제 AI 를 쓴다. 기본값 mock 은 개발용이다.
      LLM_MODE: ${LLM_MODE:-gemini}
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Seoul}
      TZ: ${APP_TIMEZONE:-Asia/Seoul}
      STORAGE_ROOT_PATH: /app/uploads
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      # 업로드한 강의자료. 이 볼륨이 없으면 컨테이너를 다시 만들 때마다 사라진다.
      - uploads:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    # 백엔드도 밖으로 열지 않는다. 브라우저는 프론트를 통해서만 API 에 닿는다.
    expose:
      - "8080"

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      # 브라우저가 아니라 Next 서버가 쓰는 주소다. 서비스 이름으로 부른다.
      BACKEND_URL: http://backend:8080
      TZ: ${APP_TIMEZONE:-Asia/Seoul}
    ports:
      # 밖으로 열리는 유일한 포트. EC2 보안 그룹에서 이 포트만 열면 된다.
      - "${PUBLIC_PORT:-80}:3000"

volumes:
  db-data:
  uploads:
