# 「내일까지 해야 하는데」 전체 스택.
#
#   docker compose up -d --build
#
# 이 한 줄로 DB · 백엔드 · 프론트가 뜬다. 브라우저에서 http://<서버주소> 를 연다.
#
# 필요한 것은 저장소 루트의 .env 하나뿐이다.
#
#   GEMINI_API_KEY=...
#
# 자세한 절차는 docs/deployment.html 참고.

name: naeil

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-naeil_study}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      TZ: ${APP_TIMEZONE:-Asia/Seoul}
    volumes:
      - db-data:/var/lib/postgresql/data
      # 스키마를 여기서 넣지 않는다. 백엔드가 뜨면서 Flyway 로 적용한다.
      #
      # 예전에는 docs/schema.sql 을 initdb 에 물려 두었다. 그 방식은 **빈 볼륨으로
      # 처음 뜰 때만** 동작해서, 이미 데이터가 있는 DB 에는 아무 일도 하지 않았다.
      # 그래서 컬럼이 늘 때마다 사람이 psql 로 따로 적용해야 했고, 그 순서를 틀리면
      # 새 이미지가 기동 중 죽었다. 이제 경로가 하나뿐이다.
    healthcheck:
      # 백엔드가 DB 를 기다렸다가 뜨게 한다. 없으면 첫 기동에서 연결 실패로 죽는다.
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-naeil_study}"]
      interval: 5s
      timeout: 5s
      retries: 20
    # DB 를 밖으로 열지 않는다. 백엔드만 내부 네트워크로 접근한다.
    expose:
      - "5432"

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME:-naeil_study}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      # AI 키. 저장소 루트 .env 에서 읽는다. 이미지에 넣지 않는다.
      GEMINI_API_KEY: ${GEMINI_API_KEY:?GEMINI_API_KEY 를 .env 에 넣어 주세요}
      AI_PROVIDER: ${AI_PROVIDER:-gemini}
      # 배포에서는 실제 AI 를 쓴다. 기본값 mock 은 개발용이다.
      LLM_MODE: ${LLM_MODE:-gemini}
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Seoul}
      TZ: ${APP_TIMEZONE:-Asia/Seoul}
      STORAGE_ROOT_PATH: /app/uploads
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      # 업로드한 강의자료. 이 볼륨이 없으면 컨테이너를 다시 만들 때마다 사라진다.
      - uploads:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      # 첫 기동에는 스키마 마이그레이션이 함께 돈다. t2.micro 같은 작은 인스턴스에서는
      # JVM 기동만으로도 30초를 넘기므로 넉넉히 잡는다. 이 구간의 실패는 재시도로 세지 않는다.
      start_period: 120s
    # 백엔드도 밖으로 열지 않는다. 브라우저는 프론트를 통해서만 API 에 닿는다.
    expose:
      - "8080"

  frontend:
    build:
      context: ./frontend
      args:
        # 링크 미리보기 이미지 주소에 쓴다. EC2 에 올릴 때 실제 도메인으로 바꾼다.
        NEXT_PUBLIC_SITE_URL: ${SITE_URL:-http://localhost}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      # 브라우저가 아니라 Next 서버가 쓰는 주소다. 서비스 이름으로 부른다.
      BACKEND_URL: http://backend:8080
      TZ: ${APP_TIMEZONE:-Asia/Seoul}
    ports:
      # 밖으로 열리는 유일한 포트. EC2 보안 그룹에서 이 포트만 열면 된다.
      - "${PUBLIC_PORT:-80}:3000"

volumes:
  db-data:
  uploads:
